name: Build app

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      publish:
        required: true
        type: boolean

jobs:
  prepare:
    name: Prepare
    if: github.repository == 'Ottes42/ha-addons'
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
      released: ${{ steps.released.outputs.released }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ inputs.app }}"

      # Values go through env, the description contains spaces and parentheses
      - name: Normalize app information
        id: normalize
        env:
          IMAGE: ${{ steps.info.outputs.image }}
          VERSION: ${{ steps.info.outputs.version }}
          NAME: ${{ steps.info.outputs.name }}
          DESCRIPTION: ${{ steps.info.outputs.description }}
          URL: ${{ steps.info.outputs.url }}
        run: |
          # The info helper returns JSON-encoded strings ("1.4.0"), decode them
          unquote() {
            if [[ "$1" == \"*\" ]]; then jq -rn --argjson v "$1" '$v'; else printf '%s' "$1"; fi
          }
          IMAGE="$(unquote "${IMAGE}")"
          VERSION="$(unquote "${VERSION}")"
          NAME="$(unquote "${NAME}")"
          DESCRIPTION="$(unquote "${DESCRIPTION}")"
          URL="$(unquote "${URL}")"
          if [[ -z "${IMAGE}" || "${IMAGE}" == "null" ]]; then
            echo "::error::${{ inputs.app }}/config.yaml has no image" && exit 1
          fi
          # GHCR needs lowercase names (ghcr.io/ottes42/herdr)
          image="${IMAGE,,}"
          {
            echo "image_name=${image##*/}"
            echo "registry_prefix=${image%/*}"
            echo "version=${VERSION}"
            echo "name=${NAME}"
            echo "description=${DESCRIPTION}"
            if [[ -n "${URL}" && "${URL}" != "null" ]]; then
              echo "url=${URL}"
            fi
          } >> "$GITHUB_OUTPUT"

      # Our own check instead of the builder's skip-existing: that one fails
      # while the package does not exist on GHCR yet (first publish)
      - name: Check whether this version is already published
        id: released
        env:
          IMAGE: ${{ steps.normalize.outputs.registry_prefix }}/${{ steps.normalize.outputs.image_name }}
          VERSION: ${{ steps.normalize.outputs.version }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${IMAGE#ghcr.io/}"
          token=$(curl -fsS -u "${GH_ACTOR}:${GH_TOKEN}" \
            "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r '.token // empty' || true)
          status=$(curl -s -o /dev/null -w '%{http_code}' -I \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/${repo}/manifests/${VERSION}")
          echo "Manifest ${IMAGE}:${VERSION}: HTTP ${status}"
          if [[ "${status}" == "200" ]]; then
            echo "::notice::${IMAGE}:${VERSION} is already published, building without pushing"
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./${{ inputs.app }}"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: ${{ inputs.publish && needs.prepare.outputs.released != 'true' }}
          # Without a version bump: build as a test, never overwrite a release
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    if: inputs.publish && needs.prepare.outputs.released != 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
