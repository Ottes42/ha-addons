name: herdr
version: "1.3.1"
slug: herdr
description: Dauerhaft laufender herdr-Server für Coding-Agents (Claude Code) mit Home-Assistant- und ESPHome-Werkzeugen
url: https://github.com/Ottes42/ha-addons/tree/main/herdr
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
watchdog: tcp://[HOST]:[PORT:2222]
ingress: true
ingress_port: 7681
panel_icon: mdi:console-line
panel_title: herdr
homeassistant_api: true
hassio_api: true
# manager: add-on logs and management, backups (ha addons ..., ha backups ...)
hassio_role: manager
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: addon_config
    read_only: false
    path: /addon_config
  - type: share
    read_only: false
  - type: addons
    read_only: false
ports:
  2222/tcp: 2222
ports_description:
  2222/tcp: SSH (for herdr --remote)
options:
  authorized_keys: []
  ha_secrets: []
  env_vars: []
  agent_instructions: ""
  claude_allow: []
  claude_deny: []
schema:
  authorized_keys:
    - str
  ha_secrets:
    - str
  env_vars:
    - name: match(^[A-Za-z_][A-Za-z0-9_]*$)
      value: password
  agent_instructions: str?
  claude_allow:
    - str
  claude_deny:
    - str
