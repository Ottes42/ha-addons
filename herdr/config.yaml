name: herdr
version: "1.0.0"
slug: herdr
description: Persistent herdr server for coding agents (Claude Code), via SSH and web terminal
url: https://github.com/Ottes42/ha-addons/tree/main/herdr
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
watchdog: tcp://[HOST]:[PORT:2222]
ingress: true
ingress_port: 7681
panel_icon: mdi:console-line
panel_title: herdr
homeassistant_api: true
hassio_api: true
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: addon_config
    read_only: false
    path: /addon_config
  - type: share
    read_only: false
  - type: addons
    read_only: false
ports:
  2222/tcp: 2222
ports_description:
  2222/tcp: SSH (for herdr --remote)
options:
  authorized_keys: []
  ha_secrets: []
  env_vars: []
schema:
  authorized_keys:
    - str
  ha_secrets:
    - str
  env_vars:
    - name: match(^[A-Za-z_][A-Za-z0-9_]*$)
      value: password
