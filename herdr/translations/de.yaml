configuration:
  authorized_keys:
    name: Erlaubte SSH-Schlüssel
    description: Öffentliche Schlüssel, die sich auf Port 2222 als root anmelden dürfen.
  ha_secrets:
    name: Geheimnisse aus secrets.yaml
    description: >-
      Schlüssel aus /config/secrets.yaml, die als Umgebungsvariablen exportiert werden.
      `grocy_api_key` wird zu GROCY_API_KEY, `GROCY=grocy_api_key` setzt einen eigenen Namen.
  env_vars:
    name: Umgebungsvariablen
    description: >-
      Weitere Variablen (Name und Wert) für herdr-Panes und Shells. Keine Tokens oder
      Passwörter: Die Werte stehen im Klartext in den Add-on-Optionen. Geheimnisse in
      /config/secrets.yaml eintragen und oben unter „Geheimnisse aus secrets.yaml“ verweisen.
  agent_instructions:
    name: Anweisungen für Agents
    description: >-
      Eigene Anweisungen für Claude Code und andere Agents, angehängt an den
      verwalteten Block in ~/.claude/CLAUDE.md und ~/.codex/AGENTS.md.
  permission_mode:
    name: Claude Code – Berechtigungsmodus
    description: >-
      read: nur lesende Werkzeuge ohne Rückfrage. build: dazu Domains neu laden,
      ha-ws, ha-notify, ESPHome flashen. admin: dazu Neustarts von Core und anderen
      Add-ons, Backups, beliebige Dienstaufrufe. herdr selbst bleibt immer gesperrt.
  claude_allow:
    name: Claude Code – erlaubte Regeln
    description: >-
      Zusätzliche Berechtigungsregeln ohne Rückfrage, z. B. Bash(git status).
      Lesende Home-Assistant-Werkzeuge sind standardmäßig erlaubt.
  claude_deny:
    name: Claude Code – verbotene Regeln
    description: Berechtigungsregeln, die Claude Code nie nutzen darf, z. B. Bash(rm -rf *).
  apt_packages:
    name: Debian-Pakete
    description: >-
      Zusätzliche Pakete aus Debian, z. B. htop. Werden bei jedem Start installiert,
      die Downloads bleiben im Cache.
  npm_packages:
    name: npm-Pakete
    description: >-
      Globale npm-Pakete in ~/.local, z. B. ruflo oder ruflo@3.56.10 (feste Version).
      Ohne Version aktualisiert herdr sie beim Start, wenn es eine neue gibt.
  uv_tools:
    name: Python-Werkzeuge (uv)
    description: >-
      Werkzeuge für `uv tool install`, z. B. ruff. Ohne Versionsangabe beim Start aktualisiert.
network:
  2222/tcp: SSH (für herdr --remote)
