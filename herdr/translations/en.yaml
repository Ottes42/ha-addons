configuration:
  authorized_keys:
    name: Authorized SSH keys
    description: Public keys allowed to log in as root on port 2222.
  ha_secrets:
    name: Secrets from secrets.yaml
    description: >-
      Keys from /config/secrets.yaml to export as environment variables.
      `grocy_api_key` becomes GROCY_API_KEY, `GROCY=grocy_api_key` sets a custom name.
  env_vars:
    name: Environment variables
    description: >-
      Additional variables (name and value) for herdr panes and shells. No tokens or
      passwords: values are stored in plain text in the add-on options. Put secrets in
      /config/secrets.yaml and reference them under "Secrets from secrets.yaml" above.
  agent_instructions:
    name: Agent instructions
    description: >-
      Additional instructions for Claude Code and other agents, appended to the
      managed block in ~/.claude/CLAUDE.md and ~/.codex/AGENTS.md.
  claude_allow:
    name: Claude Code allow rules
    description: >-
      Extra permission rules allowed without asking, e.g. Bash(git status).
      Read-only Home Assistant tools are allowed by default.
  claude_deny:
    name: Claude Code deny rules
    description: Permission rules Claude Code must never use, e.g. Bash(rm -rf *).
network:
  2222/tcp: SSH (for herdr --remote)
